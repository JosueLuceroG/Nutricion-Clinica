name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PNPM_VERSION: 11.5.0
  NODE_VERSION: 24

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      public_api_url: ${{ steps.endpoints.outputs.public_api_url }}
      public_web_url: ${{ steps.endpoints.outputs.public_web_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate semantic release tag
        id: version
        shell: bash
        run: |
          release_version="$(node deployment/scripts/release-version.mjs "${GITHUB_REF_NAME}")"
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"

      - name: Snapshot public release endpoints
        id: endpoints
        shell: bash
        env:
          PUBLIC_API_URL: ${{ vars.DESKTOP_PUBLIC_API_URL }}
          PUBLIC_WEB_URL: ${{ vars.DESKTOP_PUBLIC_WEB_URL }}
        run: |
          printf 'public_api_url=%s\n' "${PUBLIC_API_URL}" >> "$GITHUB_OUTPUT"
          printf 'public_web_url=%s\n' "${PUBLIC_WEB_URL}" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          release_lookup="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>&1)"
          lookup_status=$?
          set -e
          if [ "${lookup_status}" -eq 0 ]; then
            echo "Release ${GITHUB_REF_NAME} already exists and is immutable" >&2
            exit 1
          fi
          if ! grep -q '(HTTP 404)' <<<"${release_lookup}"; then
            echo "Unable to prove that release ${GITHUB_REF_NAME} does not exist" >&2
            printf '%s\n' "${release_lookup}" >&2
            exit 1
          fi

  foundation:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      release_version: ${{ needs.prepare.outputs.release_version }}
      public_api_url: ${{ needs.prepare.outputs.public_api_url }}
      public_web_url: ${{ needs.prepare.outputs.public_web_url }}

  release-contract:
    name: Desktop Release Contract
    runs-on: ubuntu-latest
    needs: [prepare, foundation]
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply release version to Desktop config
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          DESKTOP_API_ORIGIN: ${{ needs.prepare.outputs.public_api_url }}
        run: node deployment/scripts/set-desktop-version.mjs

      - name: Download portable release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: portable-deployment-${{ github.sha }}
          path: foundation

      - name: Verify commit-bound foundation manifest
        env:
          RELEASE_MANIFEST_VERIFICATION_MODE: foundation
          EXPECTED_RELEASE_COMMIT: ${{ github.sha }}
          EXPECTED_RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          REQUIRE_RELEASE_ENDPOINTS: "true"
        run: node deployment/scripts/verify-release-manifest.mjs foundation/release-manifest.json

      - name: Verify publication prerequisites
        env:
          DESKTOP_RELEASE_AUTHORIZED: ${{ vars.DESKTOP_RELEASE_AUTHORIZED }}
          DESKTOP_SIGNING_STATUS: ${{ vars.DESKTOP_SIGNING_STATUS }}
          DESKTOP_UPDATER_STATUS: ${{ vars.DESKTOP_UPDATER_STATUS }}
          DESKTOP_PUBLIC_API_URL: ${{ needs.prepare.outputs.public_api_url }}
          DESKTOP_RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: node deployment/scripts/verify-desktop-release.mjs

  build-tauri:
    name: Build Tauri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [prepare, release-contract]
    environment: desktop-release
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply release version to Desktop config
        env:
          DESKTOP_API_ORIGIN: ${{ needs.prepare.outputs.public_api_url }}
        run: node deployment/scripts/set-desktop-version.mjs

      - name: Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "store-dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.store-dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build Tauri
        env:
          VITE_API_URL: ${{ needs.prepare.outputs.public_api_url }}
          VITE_RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm build:tauri

      - name: Verify updater signatures
        shell: bash
        run: |
          updater_count=0
          while IFS= read -r -d '' artifact; do
            test -s "${artifact}.sig"
            updater_count=$((updater_count + 1))
          done < <(find src-tauri/target/release/bundle -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0)
          test "${updater_count}" -gt 0

      - name: Verify Windows Authenticode
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Recurse src-tauri/target/release/bundle -Include *.exe,*.msi
          if ($artifacts.Count -eq 0) { throw 'No Windows artifacts found' }
          foreach ($artifact in $artifacts) {
            if ((Get-AuthenticodeSignature $artifact.FullName).Status -ne 'Valid') {
              throw "Unsigned Windows artifact: $($artifact.FullName)"
            }
          }

      - name: Verify macOS certificate signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="$(find src-tauri/target/release/bundle -type d -name '*.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep '^Authority='

      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tauri-${{ runner.os }}
          path: src-tauri/target/release/bundle/**
          retention-days: 7

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, foundation, build-tauri]
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install manifest dependencies
        run: pnpm install --frozen-lockfile --filter @nutriclinica/api...

      - name: Download portable release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: portable-deployment-${{ github.sha }}
          path: foundation

      - name: Download Tauri artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tauri-*
          path: release-assets
          merge-multiple: true

      - name: Build digest-bound release manifest and checksums
        env:
          PUBLIC_API_URL: ${{ needs.prepare.outputs.public_api_url }}
          PUBLIC_WEB_URL: ${{ needs.prepare.outputs.public_web_url }}
          EXPECTED_RELEASE_COMMIT: ${{ github.sha }}
          EXPECTED_RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          RELEASE_MANIFEST_VERIFICATION_MODE: deployment
          DESKTOP_RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        shell: bash
        run: |
          cp "foundation/nutriclinica-api-${RELEASE_VERSION}.tar" "nutriclinica-api-${RELEASE_VERSION}.tar"
          cp "foundation/nutriclinica-web-${RELEASE_VERSION}.tar" "nutriclinica-web-${RELEASE_VERSION}.tar"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "nutriclinica-desktop-${RELEASE_VERSION}.tar.gz" -C release-assets .

          export API_ARTIFACT_DIGEST="$(node -p "JSON.parse(require('fs').readFileSync('foundation/api-image-metadata.json','utf8'))['containerimage.digest']")"
          export WEB_ARTIFACT_DIGEST="$(node -p "JSON.parse(require('fs').readFileSync('foundation/web-image-metadata.json','utf8'))['containerimage.digest']")"
          export DESKTOP_ARTIFACT_DIGEST="sha256:$(sha256sum "nutriclinica-desktop-${RELEASE_VERSION}.tar.gz" | cut -d' ' -f1)"
          export API_ARTIFACT="local/nutriclinica-api@${API_ARTIFACT_DIGEST}"
          export WEB_ARTIFACT="local/nutriclinica-web@${WEB_ARTIFACT_DIGEST}"
          export DESKTOP_ARTIFACT="github-release/${GITHUB_REPOSITORY}/nutriclinica-desktop-${RELEASE_VERSION}.tar.gz@${DESKTOP_ARTIFACT_DIGEST}"
          export ENVIRONMENT_CLASS=TEST
          export ENVIRONMENT_NAME=release-publication
          export INSTANCE_ID="github-release-${GITHUB_RUN_ID}"
          export DEPLOYMENT_ID="github-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export GIT_COMMIT="${GITHUB_SHA}"
          export SECRET_SCAN_STATUS=PASS
          export SECRET_SCAN_COMMIT="${GITHUB_SHA}"
          export SECRET_SCAN_EVIDENCE_ID="$(node -p "JSON.parse(require('fs').readFileSync('foundation/release-manifest.json','utf8')).securityEvidence.evidenceId")"
          export API_REPLICAS=1
          export JOBS_REPLICAS=1

          pnpm --filter @nutriclinica/api release:manifest
          pnpm deployment:manifest:verify

          mapfile -d '' release_files < <(find release-assets -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.sig' -o -name '*.tar.gz' -o -name '*.zip' \) -print0 | sort -z)
          test "${#release_files[@]}" -gt 0
          duplicate_names="$(printf '%s\n' "${release_files[@]##*/}" | sort | uniq -d)"
          test -z "${duplicate_names}" || { echo "Duplicate release asset names: ${duplicate_names}" >&2; exit 1; }
          : > SHA256SUMS
          for asset in "${release_files[@]}"; do
            printf '%s  %s\n' "$(sha256sum "${asset}" | cut -d' ' -f1)" "${asset##*/}" >> SHA256SUMS
          done
          sha256sum "nutriclinica-api-${RELEASE_VERSION}.tar" "nutriclinica-web-${RELEASE_VERSION}.tar" "nutriclinica-desktop-${RELEASE_VERSION}.tar.gz" release-manifest.json >> SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.prepare.outputs.release_version, '-') }}
          make_latest: ${{ contains(needs.prepare.outputs.release_version, '-') && 'false' || 'true' }}
          overwrite_files: false
          files: |
            release-assets/**/*.msi
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.sig
            release-assets/**/*.tar.gz
            release-assets/**/*.zip
            nutriclinica-api-${{ env.RELEASE_VERSION }}.tar
            nutriclinica-web-${{ env.RELEASE_VERSION }}.tar
            nutriclinica-desktop-${{ env.RELEASE_VERSION }}.tar.gz
            release-manifest.json
            SHA256SUMS
